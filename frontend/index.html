<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Semantic Image Retrieval</title>
    <link rel="stylesheet" href="style.css">
  </head>
<body class="page">

  <div class="search-row">
    <input
      id="q"
      type="text"
      placeholder="Search..."
      class="search-input"
    >
    <button
      id="search-btn"
      class="btn btn-primary"
    >
      Search
    </button>

    <input id="imageFile" type="file" accept="image/*" class="hidden">
    <button
      id="image-search-btn"
      class="btn btn-secondary"
    >
      Search by Image
    </button>
    <div id="timing" class="timing-badge"></div>
  </div>

  <div class="results">
    <div class="results-row">
      <div class="result-card">
        <img id="result-0" class="result-img">
        <div id="score-0" class="result-score"></div>
      </div>
      <div class="result-card">
        <img id="result-1" class="result-img">
        <div id="score-1" class="result-score"></div>
      </div>
      <div class="result-card">
        <img id="result-2" class="result-img">
        <div id="score-2" class="result-score"></div>
      </div>
    </div>
    <div class="results-row">
      <div class="result-card">
        <img id="result-3" class="result-img">
        <div id="score-3" class="result-score"></div>
      </div>
      <div class="result-card">
        <img id="result-4" class="result-img">
        <div id="score-4" class="result-score"></div>
      </div>
      <div class="result-card">
        <img id="result-5" class="result-img">
        <div id="score-5" class="result-score"></div>
      </div>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div id="modalContent" class="modal-content">
      <img id="modalImg" class="modal-img">

      <div class="modal-info">
        <div id="modalCaption" class="modal-caption"></div>

        <div class="modal-ask-row">
          <input
            id="modalQuestion"
            type="text"
            placeholder="Ask about this image..."
            class="search-input modal-question-input"
          >
          <button id="modal-ask-btn" class="btn btn-primary">Ask</button>
        </div>

        <div id="modalAnswer" class="modal-answer"></div>
      </div>
    </div>

    <div class="modal-close-wrap">

      <button
        id="modal-download-btn"
        class="modal-download-btn"
        title="Download image"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12" />
          <path d="M7 10l5 5 5-5" />
          <path d="M5 21h14" />
        </svg>
      </button>

      <button
        id="modal-close-btn"
        class="modal-close-btn"
      >
        &times;
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
